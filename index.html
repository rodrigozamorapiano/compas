<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07122B">
<meta name="color-scheme" content="dark">
<title>Compás</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=DM+Sans:wght@400;500;700&display=swap">
<style>
html, body { margin: 0; height: 100%; }
/* Diseño único en negro: fondo negro, títulos en amarillo dorado, pentagrama y teclas en tonos claros.
   Inicio = pentagrama de bienvenida + ruta de lecciones. Lección = progreso arriba, figura al centro, botón abajo. */
:root {
  --bg: #07122B;
  --surface: #0E1F45;
  --ink: #EEF3FF;
  --muted: #9DB1D9;
  --line: #243F7A;
  --staff: #DDE7FB;
  --gold: #FFFFFF;
  --accent: #5B9BFF;
  --accent-ink: #06122B;
  --accent-soft: rgba(91, 155, 255, .2);
  --ok: #5FD39A;
  --ok-soft: rgba(95, 211, 154, .17);
  --bad: #FF8F78;
  --bad-soft: rgba(255, 143, 120, .17);
  --key: #F4F7FF;
  --f-display: 'Cormorant Garamond', 'Playfair Display', Georgia, 'Times New Roman', serif;
  --f-body: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-block: 12px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .nt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 600px; margin: 0 auto; min-width: 0; }
[hidden] { display: none !important; }
h1, h2, h3 { color: var(--gold); }

/* Pentagrama */
.staff, .kb { width: 100%; height: auto; display: block; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.sl { stroke: var(--staff); stroke-width: 1.5; }
.clef path { fill: var(--staff); }
.band { fill: var(--accent-soft); }
.band.ok { fill: var(--ok-soft); }
.band.bad { fill: var(--bad-soft); }
.nt { color: var(--staff); }
.nt .head { fill: currentColor; }
.nt .stem { stroke: currentColor; stroke-width: 1.7; }
.nt .led { stroke: var(--staff); stroke-width: 1.5; }
.nt .hit { fill: transparent; }
.nt.tap { cursor: pointer; }
.nt.active, .nt.ghost { color: var(--accent); }
.nt.ok { color: var(--ok); }
.nt.bad { color: var(--bad); }
.nt:focus-visible { outline: none; }
.nt:focus-visible .hit { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
.lbl { font: 700 13px var(--f-body); fill: var(--ink); }
.acc { color: var(--staff); }
.nt .acc { color: inherit; }
.acc line { stroke: currentColor; stroke-width: 1.7; }
.acc .bar { stroke-width: 3.6; }
.acc path { stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; }

/* Teclado */
.key { cursor: pointer; }
.key.w rect { fill: var(--key); stroke: #0A1534; stroke-width: 1.5; }
.key.b rect { fill: #0F2250; stroke: #6F8CC8; stroke-width: 1; }
.key.seen.w rect { fill: #BFD6FF; }
.key.seen.b rect { fill: #2F5CA8; }
.key.active rect { fill: var(--accent); }
.key.ok rect { fill: var(--ok); }
.key.bad rect { fill: var(--bad); }
.key text { font: 700 12.5px var(--f-body); text-anchor: middle; pointer-events: none; fill: #06122B; }
.key.b text { fill: #fff; font-size: 9.5px; }
.key.b.active text, .key.b.ok text, .key.b.bad text { fill: #06122B; }
.key:focus-visible { outline: none; }
.key:focus-visible rect { stroke: var(--accent); stroke-width: 3; }

/* Ritmo */
.rs { width: 100%; height: auto; display: block; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.rline { stroke: var(--staff); stroke-width: 1.5; }
.rbar { stroke: var(--staff); stroke-width: 1.6; }
.rbar.thick { stroke-width: 3.6; }
.ts { font: 700 28px var(--f-display); fill: var(--staff); text-anchor: middle; }
.cnt { font: 700 13px var(--f-body); fill: var(--muted); text-anchor: middle; }
.cnt.on { fill: var(--gold); }
.rn { color: var(--staff); }
.rn .hd { fill: currentColor; }
.rn .op { fill: none; stroke: currentColor; stroke-width: 2.3; }
.rn .hole { fill: var(--surface); }
.rn .st { stroke: currentColor; stroke-width: 1.8; }
.rn .fl { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; }
.rn .bm { stroke: currentColor; }
.rn .rp { fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.rn .hit { fill: transparent; }
.rn.tap { cursor: pointer; }
.rn.active { color: var(--accent); }
.rn.ok { color: var(--ok); }
.rn.bad { color: var(--bad); }
.rn:focus-visible { outline: none; }
.rn:focus-visible .hit { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
.ph { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
.phq { font: 700 30px var(--f-display); fill: var(--gold); text-anchor: middle; }
.bx { fill: var(--line); }
.bx.on { fill: var(--accent); }
.seg { fill: var(--line); }
.seg.on { fill: var(--accent); opacity: .5; }
.seg.now { fill: var(--accent); }
.row { cursor: pointer; }
.row:focus-visible { outline: none; }
.row:focus-visible .seg { stroke: var(--accent); stroke-width: 2; }
.pdot { fill: var(--line); }
.pdot.on { fill: var(--accent); }
.pal { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.vbtn { grid-column: span 2; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 62px; padding: 6px 4px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 700; font-size: 13px; min-width: 0; }
.vbtn:nth-child(n+4) { grid-column: span 3; }
.vbtn:hover:not(:disabled) { border-color: var(--accent); }
.vbtn:disabled { opacity: .5; cursor: default; }
.vbtn span { min-width: 0; white-space: nowrap; }
.mini { width: 30px; height: auto; flex: none; }
.opt.rh { flex-direction: column; align-items: stretch; padding: 6px 6px 4px; min-height: 0; font: 700 17px var(--f-display); }
.opt.rh small { align-self: flex-start; padding-left: 4px; }
.opt.rh svg { width: 100%; height: auto; }
.pad { width: 100%; margin-top: 14px; min-height: 96px; border-radius: 16px; border: 2px dashed var(--accent); background: var(--accent-soft); color: var(--gold); font: 700 28px var(--f-display); letter-spacing: .06em; touch-action: manipulation; }
.pad:active:not(:disabled) { background: var(--accent); color: var(--accent-ink); }
.pad:disabled { opacity: .45; cursor: default; }

/* Inicio */
.hero { padding-top: 8px; }
.hero .fig { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 8px 4px; }
.hero h1 { font: 700 clamp(60px, 17vw, 92px)/.9 var(--f-display); letter-spacing: -.01em; font-style: italic; margin: 22px 0 10px; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); max-width: 46ch; font-size: 17px; }
.hint { font-size: 13px; color: var(--muted); margin: 6px 4px 0; text-align: center; }
.path-title { font: 700 12px var(--f-body); letter-spacing: .12em; text-transform: uppercase; margin: 34px 0 14px; }
.path { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.path li { display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 14px; position: relative; padding-bottom: 18px; }
.path li:last-child { padding-bottom: 0; }
.path li::before { content: ""; position: absolute; left: 19px; top: 40px; bottom: 0; width: 2px; background: var(--line); }
.path li:last-child::before { display: none; }
.node { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 700 21px var(--f-display); background: var(--surface); border: 2px solid var(--line); color: var(--muted); }
.path .open .node { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.path .done .node { background: var(--ok); border-color: var(--ok); color: #06140D; }
.lesson { min-width: 0; padding-top: 6px; }
.lesson h3 { margin: 0; font: 700 22px/1.15 var(--f-display); text-wrap: balance; }
.lesson p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.lesson .soon { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: inline-block; margin-top: 6px; }
.path li:not(.open):not(.done) .lesson h3 { color: var(--muted); }
.open .lesson, .done .lesson { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.open .lesson .btn, .done .lesson .btn { margin-top: 14px; }
.best { font-size: 14px; color: var(--ok); font-weight: 700; margin-top: 8px; }

/* Botones */
.btn { appearance: none; border: 0; border-radius: 12px; padding: 14px 22px; font-weight: 700; font-size: 16px; background: #FFFFFF; color: #07122B; min-height: 50px; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.btn.ghost:hover:not(:disabled) { border-color: var(--accent); filter: none; }
.btn.wide { width: 100%; }

/* Lección */
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.icon-btn { width: 42px; height: 42px; flex: none; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 18px; line-height: 1; }
.icon-btn[aria-pressed="false"] { color: var(--muted); }
.bar { flex: 1; height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; min-width: 0; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .35s ease; }
.kicker { font: 700 12px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 0 0 6px; }
h2 { font: 700 clamp(32px, 8vw, 42px)/1.05 var(--f-display); letter-spacing: 0; margin: 0 0 10px; text-wrap: balance; }
.lead { margin: 0 0 18px; font-size: 17px; max-width: 52ch; }
.fig { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 8px 6px; }
.fig + .fig { margin-top: 10px; }
.fb { margin-top: 14px; min-height: 4.6em; border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.fb.info { background: var(--accent-soft); }
.fb.ok { background: var(--ok-soft); }
.fb.bad { background: var(--bad-soft); }
.fb b.k { display: block; font: 700 18px var(--f-display); margin-bottom: 1px; }
.fb.ok b.k { color: var(--ok); }
.fb.bad b.k { color: var(--bad); }
.fb.info b.k { color: var(--gold); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; min-height: 64px; font: 700 28px var(--f-display); display: flex; align-items: center; justify-content: center; flex-wrap: wrap; column-gap: 8px; padding: 6px 8px; }
.opt small { font: 500 13px var(--f-body); color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.dim { opacity: .5; }
.tools { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.tools .btn { flex: 1 1 120px; }
.tools .nudge { flex: 0 0 56px; padding-inline: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 15px; min-height: 40px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--gold); }
.chip.seen { border-color: #2E5AAD; }
.pat { display: flex; gap: 6px; margin-top: 10px; }
.pat span { text-align: center; font: 700 18px var(--f-display); padding: 8px 0; border-radius: 8px; background: var(--surface); border: 2px solid var(--line); color: var(--muted); min-width: 0; }
.pat span.T { flex: 2; }
.pat span.S { flex: 1; }
.pat span.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.pat span.cur { border-color: var(--accent); color: var(--gold); background: var(--accent-soft); }
.dock { max-width: 600px; margin: 16px auto 0; display: flex; }
.score { font: 700 76px/1 var(--f-display); letter-spacing: 0; margin: 4px 0 6px; color: var(--gold); }
.score span { font-size: 28px; color: var(--muted); font-weight: 600; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.stack { display: grid; gap: 10px; margin-top: 16px; }
.stack .row2 { margin-top: 0; }
@media (max-width: 380px) { .row2 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

.hand .palm { fill: #0F2250; stroke: var(--line); stroke-width: 2; }
.hand .fing { cursor: default; }
.hand .fng { fill: #0F2250; stroke: #6F8CC8; stroke-width: 2; }
.hand .fing.tap { cursor: pointer; }
.hand .fing.seen .fng { fill: #173C80; stroke: var(--accent); }
.hand .fing.sel .fng, .hand .fing.active .fng { fill: var(--accent); stroke: var(--accent); }
.hand .fing.ok .fng { fill: var(--ok); stroke: var(--ok); }
.hand .fing.bad .fng { fill: var(--bad); stroke: var(--bad); }
.hand .fnum { font: 700 15px var(--f-body); fill: var(--ink); text-anchor: middle; pointer-events: none; }
.hand .fing.sel .fnum, .hand .fing.active .fnum, .hand .fing.ok .fnum, .hand .fing.bad .fnum { fill: #06122B; }
.pedal .rod { fill: #2B4780; }
.pedal .pd { fill: #0F2250; stroke: #5B9BFF; stroke-width: 2; }
.pedal text { font: 700 14px var(--f-body); fill: var(--ink); text-anchor: middle; }
.pedal.tap { cursor: pointer; }
.pedal.sel .pd, .pedal.on .pd { fill: var(--accent); }
.pedal.ok .pd { fill: var(--ok); }
.pedal.bad .pd { fill: var(--bad); }
.pedmark { font: italic 700 15px var(--f-body); fill: var(--gold); }
.rs .lbl { font-size: 13px; }
.rs .seg { fill: var(--line); }
.rs .seg.now { fill: var(--accent); }
</style>

</head>

    lp.frequency.exponentialRampToValueAtTime(Math.max(1200, f * 3) * (opt.dark || 1), t + 0.8);
    master.gain.setValueAtTime(0.0001, t);
    master.gain.linearRampToValueAtTime(opt.gain || 1, t + 0.004);
    master.gain.setValueAtTime(opt.gain || 1, t + d - rel);
    master.gain.exponentialRampToValueAtTime(0.0001, t + d);

    for (var i = 0; i < AMP.length; i++) {

      var ch = nb.getChannelData(0);
      for (var k = 0; k < ch.length; k++) ch[k] = (Math.random() * 2 - 1) * (1 - k / ch.length);

  // ---------- Dibujo: pentagrama ----------

    led.forEach(function (l) { g += '<line class="led" x1="' + (x - 17) + '" x2="' + (x + 17) + '" y1="' + yOf(l) + '" y2="' + yOf(l) + '"/>'; });

  function bind(root, h) {

  // ---------- Dibujo: teclado ----------
  function kbLayout(start, whites) {
    var keys = [], ws = [], m = start, WPC = [0, 2, 4, 5, 7, 9, 11];
    while (ws.length < whites) { if (WPC.indexOf(pcOf(m)) >= 0) ws.push(m); m++; }
    var kw = (KB_W - 8) / whites;
    ws.forEach(function (mm, i) {
      keys.push({ midi: mm, black: false, x: 4 + i * kw, w: kw });
      if (i < whites - 1 && ws[i + 1] - mm === 2) keys.push({ midi: mm + 1, black: true, x: 4 + (i + 1) * kw - kw * 0.3, w: kw * 0.6 });
    });
    return keys;
  }
  function keyboardSVG(o) {
    var keys = kbLayout(o.start === undefined ? 60 : o.start, o.whites || 8), marks = o.marks || {}, labels = o.labels || {};
    var s = '<svg class="kb" viewBox="0 0 ' + KB_W + ' ' + KB_H + '" role="group" aria-label="' + (o.label || 'Teclado de piano') + '">';
    [false, true].forEach(function (blk) {
      keys.forEach(function (k) {
        if (k.black !== blk) return;
        s += '<g class="key ' + (blk ? 'b' : 'w') + ' ' + (marks[k.midi] || '') + '" data-m="' + k.midi + '" role="button" tabindex="0" aria-label="' + nameOf(k.midi) + '">' +
          '<rect x="' + k.x + '" y="4" width="' + k.w + '" height="' + (blk ? 84 : 132) + '" rx="' + (blk ? 3 : 4) + '"/>';
        if (labels[k.midi]) s += '<text x="' + (k.x + k.w / 2) + '" y="' + (blk ? 74 : 122) + '">' + labels[k.midi] + '</text>';

    });

  }

  // Exploración de notas en el pentagrama. Cada elemento es un número (step) o {step, acc}.
  function stepExplore(kicker, title, lead, list, xs, doneMsg) {
    var items = list.map(function (v) { return typeof v === 'number' ? { step: v, acc: 0 } : v; });
    return function () {
      stageEl.innerHTML = head(kicker, title, lead) + figHTML();
      var fig = $('fig'), revealed = {}, n = 0, cur = -1;
      function draw() {
        var notes = items.map(function (it, i) {
          return { step: it.step, acc: it.acc, x: xs[i], tap: true, aria: accName(it.step, it.acc) + ', ' + loc(it.step), state: i === cur ? 'active' : '', label: revealed[i] ? accName(it.step, it.acc) : '' };
        });
        fig.innerHTML = staffSVG({ notes: notes });
        bind(fig, { onNote: function (i) {
          var it = items[i], d = info(it.step);
          cur = i; if (!revealed[i]) { revealed[i] = 1; n++; }
          play(it.step, it.acc); draw();
          var ttl = accName(it.step, it.acc) + ' (' + d.letter + accSym(it.acc) + ')';
          var extra = it.acc > 0 ? ' El sostenido la sube un semitono.' : it.acc < 0 ? ' El bemol la baja un semitono.' : '';
          if (n === items.length) { setFb('ok', ttl, 'Está en ' + loc(it.step) + '.' + extra + ' ' + doneMsg); unlock(); }
          else setFb('info', ttl, 'Está en ' + loc(it.step) + '.' + extra + ' Faltan ' + (items.length - n) + ' por tocar.');
        } });
      }
      draw(); setFb('info', 'Toca cada nota', 'Verás su nombre y la escucharás. Las letras (C D E F G A B) son el nombre internacional.');
    };
  }

  function stepName(st, clef) {
    clef = clef || curClef;
    var d = info(st, clef);
    var opts = pick(LETTERS.filter(function (l) { return l !== d.letter; }), 3).concat([d.letter]);
    opts.sort(function (a, b) { return LETTERS.indexOf(a) - LETTERS.indexOf(b); });
    var cname = clef === 'bass' ? 'clave de fa' : 'clave de sol';
    return stepChoice({
      title: '¿Qué nota es?', lead: 'Mírala en el pentagrama' + (clef === 'bass' ? ' (<b>clave de fa</b>)' : '') + ' y elige su nombre.',
      fig: function (ok) { return staffSVG({ clefType: clef, notes: [{ step: st, x: 210, state: ok === null ? '' : ok ? 'ok' : 'bad', label: ok === null ? '' : d.es }], label: 'Una nota en ' + cname }); },
      options: opts.map(function (l) { return { k: l, t: ES[l] }; }), correct: d.letter,
      hint: 'Pista: cuenta las líneas o espacios desde abajo.', wrong: 'Era ' + d.es,
      explain: 'Esta nota está en ' + loc(st) + ' y, en ' + cname + ', se llama <b>' + d.es + '</b> (' + d.letter + ').',

  }

  function stepPlace(letter) {
    return function () {
      var name = ES[letter];
      stageEl.innerHTML = head('Coloca la nota', name, 'Toca el pentagrama donde va el <b>' + name + '</b>. Sirve cualquier ' + name + ' que quepa.') +
        figBox('fig') + '<div class="tools"><button class="btn ghost nudge" id="up" aria-label="Subir la nota">▲</button><button class="btn ghost nudge" id="dn" aria-label="Bajar la nota">▼</button><button class="btn" id="chk" disabled>Comprobar</button></div>' + fbBox();
      var fig = $('fig'), chk = $('chk'), ghost = null, finished = false, cands = [];
      for (var s = -2; s <= 10; s++) if (info(s).letter === letter) cands.push(s);
      var right = cands.filter(function (c) { return c >= 0 && c <= 8; })[0];
      if (right === undefined) right = cands[0];
      function draw() {
        var notes = [];
        if (finished) {
          var ok = info(ghost).letter === letter;
          notes.push({ step: ghost, x: ok ? 210 : 170, state: ok ? 'ok' : 'bad', label: ok ? name : info(ghost).es });
          if (!ok) notes.push({ step: right, x: 270, state: 'ok', label: name });
        } else if (ghost !== null) notes.push({ step: ghost, x: 210, state: 'ghost' });
        fig.innerHTML = staffSVG({ notes: notes, label: 'Pentagrama para colocar la nota ' + name });
        if (!finished) bind(fig, { onPos: function (st) { set(Math.max(-2, Math.min(10, st))); } });
      }
      function set(st) { ghost = st; chk.disabled = false; play(st); draw(); setFb('info', 'Nota colocada', 'Si no estás seguro, ajusta con ▲ ▼ y pulsa Comprobar.'); }
      $('up').addEventListener('click', function () { if (!finished) set(ghost === null ? 4 : Math.min(10, ghost + 1)); });
      $('dn').addEventListener('click', function () { if (!finished) set(ghost === null ? 4 : Math.max(-2, ghost - 1)); });
      chk.addEventListener('click', function () {
        if (ghost === null || finished) return;
        finished = true; chk.disabled = true;
        var ok = info(ghost).letter === letter; results.push(ok); draw();
        if (ok) { setFb('ok', '¡Correcto!', 'Esa posición (' + loc(ghost) + ') es <b>' + name + '</b>.'); play(ghost); }
        else { setFb('bad', 'Esa era ' + info(ghost).es, 'Tu nota está en ' + loc(ghost) + '. El <b>' + name + '</b> está en ' + loc(right) + '.'); play(right); }
        unlock();
      });
      draw(); setFb('info', 'Escucha mientras colocas', 'Cada toque suena. Los botones ▲ ▼ mueven la nota un paso.');
    };
  }

  // Pantalla final de cada lección
  function stepSummary(n, c) {
    return function () {
      var good = results.filter(Boolean).length, total = results.length;
      saveProg(n, good, total);
      var msg = good === total ? 'Perfecto. No fallaste ninguna.' : good >= total * 0.7 ? 'Muy buen resultado. Repite la lección para afinar los fallos.' : 'Vas bien. Repetir la lección te ayudará a fijar lo aprendido.';
      var hasNext = !!BUILD[n + 1];
      stageEl.innerHTML = head('Lección ' + n + ' completa', c.title) +
        '<div class="score">' + good + '<span> / ' + total + '</span></div><p class="lead">' + msg + ' Cuenta las respuestas correctas al primer intento.</p>' +
        '<div class="fig" id="fig">' + c.fig + '</div><p class="hint">' + c.hint + '</p>' +
        '<div class="stack">' + (hasNext ? '<button class="btn wide" id="nextL">Siguiente lección</button>' : '') +
        '<div class="row2"><button class="btn ghost" id="again">Repetir lección</button><button class="btn' + (hasNext ? ' ghost' : '') + '" id="back">Volver a la ruta</button></div></div>';
      c.bindFig($('fig'));
      $('again').addEventListener('click', function () { startLesson(n); });
      $('back').addEventListener('click', home);
      if (hasNext) $('nextL').addEventListener('click', function () { startLesson(n + 1); });
      nextEl.hidden = true;
    };
  }

  function buildL1() {

    var s = [stepIntro, stepClef({
        kicker: 'Paso 2', title: 'La clave de sol',

        okText: 'La espiral de la clave rodea la línea 2, y esa línea es <b>Sol</b>. Por eso se llama clave de sol.'
      }),

      stepExplore('Paso 4', 'Las notas en los espacios', 'Los cuatro espacios de abajo hacia arriba son <b>Fa, La, Do, Mi</b>. Toca cada uno.', [1, 3, 5, 7], [110, 175, 240, 305], 'Repítelo en voz alta: Fa, La, Do, Mi.')];
    quiz1.forEach(function (st) { s.push(stepName(st)); });
    s.push(stepExplore('Paso 5', 'Más allá del pentagrama', 'Si una nota no cabe, se le añaden líneas cortas: las <b>líneas adicionales</b>. El <b>Do central</b> vive en la primera de abajo.', [-2, -1, 9, 10], [105, 165, 235, 295], 'Siguen el mismo orden de siempre: Do, Re, Mi, Fa, Sol, La, Si.'));
    letters.forEach(function (l) { s.push(stepPlace(l)); });
    quiz2.forEach(function (st) { s.push(stepName(st)); });
    var map = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(function (st, i) { return { step: st, x: 88 + i * 32, tap: true, label: info(st).es, aria: info(st).es + ', ' + loc(st) }; });
    s.push(stepSummary(1, {

    }));
    return s;
  }

  // ===================== Pasos de teclado (lecciones 2 y 3) =====================
  function stepKeyFind(c) {
    return function () {
      stageEl.innerHTML = head(c.kicker, c.title, c.lead) + figHTML();
      var fig = $('fig'), done = false;
      function draw(m, st) {
        var marks = {}; if (m !== null) marks[m] = st;
        fig.innerHTML = keyboardSVG({ start: 60, whites: 8, marks: marks });
        bindKeys(fig, tap);
      }
      function tap(m) {
        if (done) return;
        playMidi(m);
        if (pcOf(m) === c.pc) { done = true; draw(m, 'ok'); setFb('ok', '¡Eso es!', c.okText); unlock(); }
        else { draw(m, 'bad'); setFb('bad', 'Casi', 'Tocaste ' + nameOf(m) + '. ' + c.hint); }
      }
      draw(null); setFb('info', 'Pista', c.hint);
    };
  }

  function stepKeyExplore(c) {
    return function () {
      stageEl.innerHTML = head(c.kicker, c.title, c.lead) + figHTML();
      var fig = $('fig'), seen = {}, n = 0, cur = null;
      function draw() {
        var marks = {}, labels = {};
        Object.keys(seen).forEach(function (k) { marks[k] = 'seen'; if (c.label) labels[k] = c.label(+k); });
        if (cur !== null) marks[cur] = 'active';
        fig.innerHTML = keyboardSVG({ start: c.start === undefined ? 60 : c.start, whites: 8, marks: marks, labels: labels });
        bindKeys(fig, tap);
      }
      function tap(m) {
        playMidi(m);
        if (!c.allowed(m)) { setFb('info', nameOf(m), c.notAllowed); return; }
        cur = m; if (!seen[m]) { seen[m] = 1; n++; }
        draw();
        var d = c.describe(m);
        if (n >= c.need) { setFb('ok', d[0], d[1] + ' ' + c.doneText); unlock(); }
        else setFb('info', d[0], d[1] + ' Faltan ' + (c.need - n) + '.');
      }
      draw(); setFb('info', c.startTitle, c.startText);
    };
  }

  function stepPairs(c) {
    return function () {
      stageEl.innerHTML = head(c.kicker, c.title, c.lead) + figBox('fig') +
        '<div class="tools" id="pb">' + c.pairs.map(function (p, i) { return '<button class="btn ghost" data-i="' + i + '">' + p.btn + '</button>'; }).join('') + '</div>' + fbBox();
      var fig = $('fig'), heard = {}, n = 0;
      function draw(marks) { fig.innerHTML = keyboardSVG({ start: 60, whites: 8, marks: marks || {} }); }
      draw(); setFb('info', 'Toca cada botón', 'Verás las dos teclas y oirás cómo suenan una tras otra.');
      $('pb').addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
        var p = c.pairs[+b.getAttribute('data-i')], marks = {};
        marks[p.a] = 'active'; marks[p.b] = 'active'; draw(marks);
        playSeq([p.a, p.b], 550);
        if (!heard[b.getAttribute('data-i')]) { heard[b.getAttribute('data-i')] = 1; n++; }
        if (n === c.pairs.length) { setFb('ok', p.res, p.why + ' ' + c.doneText); unlock(); }
        else setFb('info', p.res, p.why + ' Faltan ' + (c.pairs.length - n) + ' por probar.');
      });
    };
  }

  function stepStaffToKey(it) {
    return function () {
      var target = midiOf(it.step, it.acc), nm = accName(it.step, it.acc), done = false;
      stageEl.innerHTML = head('Practica', '¿Dónde está en el teclado?', 'Lee la nota del pentagrama y tócala en el teclado.') + figBox('fig') + figBox('kb') + fbBox();
      var fig = $('fig'), kb = $('kb');
      fig.innerHTML = staffSVG({ notes: [{ step: it.step, acc: it.acc, x: 210 }], label: 'Una nota con alteración' });
      function draw(marks) { kb.innerHTML = keyboardSVG({ start: 60, whites: 8, marks: marks || {} }); bindKeys(kb, tap); }
      function tap(m) {
        if (done) return;
        done = true; playMidi(m);
        var ok = m === target, marks = {}; marks[target] = 'ok'; if (!ok) marks[m] = 'bad';
        results.push(ok); draw(marks);
        fig.innerHTML = staffSVG({ notes: [{ step: it.step, acc: it.acc, x: 210, state: ok ? 'ok' : 'bad', label: nm }], label: 'Una nota con alteración' });
        if (ok) setFb('ok', '¡Correcto!', 'La nota es <b>' + nm + '</b>.' + (it.acc ? ' ' + (it.acc > 0 ? 'El sostenido sube' : 'El bemol baja') + ' un semitono desde ' + info(it.step).es + '.' : ''));
        else { setFb('bad', 'Era ' + nm, 'Tocaste ' + nameOf(m) + '. ' + (it.acc ? (it.acc > 0 ? 'El sostenido sube' : 'El bemol baja') + ' un semitono desde ' + info(it.step).es + '.' : 'Esa nota es la tecla blanca ' + info(it.step).es + '.')); playMidi(target); }
        unlock();
      }
      draw(); setFb('info', 'Toca la tecla', 'Recuerda: ♯ sube un semitono y ♭ baja un semitono.');
    };
  }

  function stepSemitones(a, b) {
    var n = b - a, pool = pick([1, 2, 3, 4, 5].filter(function (x) { return x !== n; }), 3).concat([n]).sort();
    function marksFor(s) { var m = {}; var st = s === null ? 'active' : s ? 'ok' : 'bad'; m[a] = st; m[b] = st; return m; }
    return stepChoice({
      title: '¿Cuántos semitonos?', lead: 'De <b>' + nameOf(a) + '</b> a <b>' + nameOf(b) + '</b>. Cuenta cada tecla, blanca o negra.',
      fig: function (ok) { return keyboardSVG({ start: 60, whites: 8, marks: marksFor(ok) }); },
      options: pool.map(function (x) { return { k: x, t: x, s: x === 1 ? 'semitono' : 'semitonos' }; }), correct: n,
      hint: 'Cada paso a la tecla vecina vale un semitono.', wrong: 'Eran ' + n,
      explain: 'De ' + nameOf(a) + ' a ' + nameOf(b) + ' hay <b>' + plural(n, 'semitono', 'semitonos') + '</b>' + (n === 2 ? ' (un tono).' : n === 1 ? '.' : '.'),
      sound: function () { playSeq([a, b], 550); }
    });
  }

  function stepBlackKey(m) {
    var pcs = [1, 3, 6, 8, 10], right = pcOf(m);
    var opts = pick(pcs.filter(function (p) { return p !== right; }), 3).concat([right]).sort(function (x, y) { return x - y; });
    return stepChoice({
      title: '¿Qué tecla negra es?', lead: 'Elige su nombre con sostenido (♯).',
      fig: function (ok) { var mk = {}; mk[m] = ok === null ? 'active' : ok ? 'ok' : 'bad'; return keyboardSVG({ start: 60, whites: 8, marks: mk }); },
      options: opts.map(function (p) { return { k: p, t: SN[p] }; }), correct: right,
      hint: 'Mira qué tecla blanca queda a su izquierda: la negra la sube un semitono.', wrong: 'Era ' + SN[right],
      explain: 'Es <b>' + SN[right] + '</b>, que también se llama <b>' + FN[right] + '</b>. Es la misma tecla con dos nombres.',
      sound: function () { playMidi(m); }
    });
  }

  // ===================== LECCIÓN 2 =====================
  function buildL2() {

    s.push(stepKeyExplore({

    }));
    s.push(stepPairs({

      [{ step: 1, acc: 1 }, { step: 4, acc: -1 }, { step: -2, acc: 1 }, { step: 0, acc: -1 }], [115, 172, 229, 286], 'Así se escriben las teclas negras.'));
    pick([{ step: 1, acc: 1 }, { step: 4, acc: -1 }, { step: -2, acc: 1 }, { step: 0, acc: -1 }, { step: 3, acc: -1 }, { step: 2, acc: 1 }, { step: 5, acc: 0 }, { step: -1, acc: 0 }], 4)
      .forEach(function (it) { s.push(stepStaffToKey(it)); });
    var labels = {}; kbLayout(60, 8).forEach(function (k) { if (!k.black) labels[k.midi] = nameOf(k.midi); });

  // ===================== LECCIÓN 3 =====================
  var C_SCALE = [60, 62, 64, 65, 67, 69, 71, 72], C_NAMES = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si', 'Do'];
  var PAT = ['T', 'T', 'S', 'T', 'T', 'T', 'S'];
  var KEYS = [
    { k: 'C', name: 'Do mayor', sharps: [], flats: [], desc: 'no lleva sostenidos ni bemoles (solo teclas blancas).', scale: [60, 62, 64, 65, 67, 69, 71, 72] },
    { k: 'G', name: 'Sol mayor', sharps: [8], flats: [], desc: '1 sostenido: Fa♯.', scale: [67, 69, 71, 72, 74, 76, 78, 79] },
    { k: 'D', name: 'Re mayor', sharps: [8, 5], flats: [], desc: '2 sostenidos: Fa♯ y Do♯.', scale: [62, 64, 66, 67, 69, 71, 73, 74] },
    { k: 'F', name: 'Fa mayor', sharps: [], flats: [4], desc: '1 bemol: Si♭.', scale: [65, 67, 69, 70, 72, 74, 76, 77] },
    { k: 'B', name: 'Si♭ mayor', sharps: [], flats: [4, 7], desc: '2 bemoles: Si♭ y Mi♭.', scale: [70, 72, 74, 75, 77, 79, 81, 82] }
  ];
  function patChips(done, cur, pat) {
    return (pat || PAT).map(function (t, i) { return '<span class="' + t + (i < done ? ' on' : '') + (i === cur ? ' cur' : '') + '">' + t + '</span>'; }).join('');
  }

  function stepScaleWalk() {
    return function () {
      stageEl.innerHTML = head('Paso 1', 'La escala mayor', 'Una <b>escala</b> es una serie de notas ordenadas. La escala <b>mayor</b> sube con este patrón: <b>T T S T T T S</b>, donde T es un tono (2 semitonos) y S un semitono. Recórrela nota por nota.') +
        figBox('fig') + '<div class="pat" id="pat"></div><div class="tools"><button class="btn" id="nx">Siguiente nota ▶</button><button class="btn ghost" id="all">▶ Escuchar todo</button></div>' + fbBox();
      var fig = $('fig'), cur = 0;
      function draw() {
        var marks = {}, labels = {};
        for (var i = 0; i <= cur; i++) { marks[C_SCALE[i]] = i === cur ? 'active' : 'seen'; labels[C_SCALE[i]] = C_NAMES[i]; }
        fig.innerHTML = keyboardSVG({ start: 60, whites: 8, marks: marks, labels: labels });
        $('pat').innerHTML = patChips(cur, cur < 7 ? cur : -1);
        bindKeys(fig, playMidi);
      }
      draw(); playMidi(60);
      setFb('info', 'Empieza en Do', 'Esta es la <b>tónica</b>, la nota donde empieza la escala. Pulsa “Siguiente nota”.');
      $('nx').addEventListener('click', function () {
        if (cur >= 7) return;
        cur++; playMidi(C_SCALE[cur]); draw();
        var t = PAT[cur - 1];
        var txt = C_NAMES[cur - 1] + ' → ' + C_NAMES[cur] + ': ' + (t === 'T' ? 'tono (2 semitonos)' : 'semitono (1)');
        if (cur === 7) { $('nx').disabled = true; setFb('ok', '¡Escala completa!', txt + '. Esa es la escala de Do mayor: T T S T T T S.'); unlock(); }
        else setFb('info', txt, 'Faltan ' + (7 - cur) + ' notas.');
      });
      $('all').addEventListener('click', function () {
        playSeq(C_SCALE, 420, function (i) {
          var marks = {}, labels = {};

  function stepToneOrSemi(i) {

  function stepScaleBuild(c) {
    return function () {
      var ints = c.ints || [2, 2, 1, 2, 2, 2, 1], pat = c.pat || PAT, seq = [c.root];
      for (var i = 0; i < 7; i++) seq.push(seq[i] + ints[i]);
      stageEl.innerHTML = head('Construye', c.title, c.lead) + figBox('fig') + '<div class="pat" id="pat"></div>' + fbBox();
      var fig = $('fig'), pos = 1, mistakes = 0, flash = null, finished = false;
      function draw() {
        var marks = {}, labels = {};
        for (var j = 0; j < pos; j++) { marks[seq[j]] = j === pos - 1 ? 'active' : 'ok'; labels[seq[j]] = c.names[j]; }
        if (flash !== null) marks[flash] = 'bad';
        fig.innerHTML = keyboardSVG({ start: c.root, whites: 8, marks: marks, labels: labels, label: 'Teclado de la escala' });
        $('pat').innerHTML = patChips(Math.min(pos - 1, 7), pos < 8 ? pos - 1 : -1, pat);
        bindKeys(fig, tap);
      }
      function tap(m) {
        if (finished) return;
        if (m === seq[pos]) {
          playMidi(m); flash = null; pos++; draw();
          if (pos === 8) {
            finished = true; results.push(mistakes === 0);
            setFb('ok', '¡Escala de ' + c.short + ' completa!', c.done); unlock();
          } else {
            var nt = pat[pos - 1];
            setFb('info', '¡Bien!', 'Ahora sube un <b>' + (nt === 'T' ? 'tono (2 semitonos)' : 'semitono (1)') + '</b> desde ' + c.names[pos - 1] + '.');
          }
        } else {
          mistakes++; flash = m; playMidi(m); draw();
          var prev = seq[pos - 1], diff = m - prev, need = ints[pos - 1];
          setFb('bad', 'Esa no es', diff > 0 ? 'Esa tecla está a ' + plural(diff, 'semitono', 'semitonos') + ' de ' + c.names[pos - 1] + ', y el patrón pide ' + plural(need, 'semitono', 'semitonos') + ' (' + pat[pos - 1] + ').' : 'La escala sube: busca a la derecha de ' + c.names[pos - 1] + '.');
          var my = pos; timers.push(setTimeout(function () { if (!finished && pos === my && flash === m) { flash = null; draw(); } }, 700));
        }
      }
      draw();
      setFb('info', 'Empieza en ' + c.names[0], 'Toca la siguiente nota siguiendo el patrón <b>' + pat.join(' ') + '</b>. Primero: ' + (pat[0] === 'T' ? 'un tono (2 semitonos)' : 'un semitono (1)') + '.');
    };
  }

  // ===================== RITMO: motor de notación =====================
  var BPM = 100, BEAT = 60 / BPM;
  var VAL = {
    w: { es: 'Redonda', rs: 'Silencio de redonda', beats: 4, frac: '1', pl: 'redondas' },
    h: { es: 'Blanca', rs: 'Silencio de blanca', beats: 2, frac: '1/2', pl: 'blancas' },
    q: { es: 'Negra', rs: 'Silencio de negra', beats: 1, frac: '1/4', pl: 'negras' },
    e: { es: 'Corchea', rs: 'Silencio de corchea', beats: 0.5, frac: '1/8', pl: 'corcheas' },
    s: { es: 'Semicorchea', rs: 'Silencio de semicorchea', beats: 0.25, frac: '1/16', pl: 'semicorcheas' }
  };
  var VORDER = ['w', 'h', 'q', 'e', 's'];
  var RY = 70, RTOP = 38;
  function isRest(v) { return v !== '?' && v === v.toUpperCase(); }
  function vk(v) { return v.toLowerCase(); }
  function beatsOf(v) { return VAL[vk(v)].beats; }
  function sumOf(pat) { return pat.reduce(function (a, v) { return a + beatsOf(v); }, 0); }
  function fmtB(n) {
    var w = Math.floor(n), f = n - w, fs = f === 0.5 ? '½' : f === 0.25 ? '¼' : f === 0.75 ? '¾' : '';
    return ((w ? String(w) : '') + fs) || '0';
  }

  function stepTap(pat) {
    return function () {
      stageEl.innerHTML = head('Ritmo en vivo', 'Toca el ritmo', 'Oirás 4 clics de cuenta y después un compás con clics. Toca el botón grande (o la barra espaciadora) justo cuando llegue cada figura. No cuenta para tu puntaje.') +

      var fig = $('fig'), pad = $('pad'), go = $('go'), run = false, t0 = 0, taps = [], on = -1, st = {}, ms = BEAT * 1000;

      function tap() { if (!run) return; taps.push(performance.now()); playNote(72, 0.15); }

      pad.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); tap(); } });
      function finish() {
        run = false; pad.disabled = true; on = -1;
        var tt = 0, used = {}, hits = 0;
        pat.forEach(function (v, j) {
          var exp = t0 + (4 + tt) * ms, best = -1, bd = 1e9;

          if (best >= 0 && bd <= 170) { used[best] = 1; hits++; st[j] = 'ok'; } else st[j] = 'bad';

      });
      draw(); setFb('info', 'Listo', 'Pulsa Empezar cuando quieras.');
    };
  }

  function buildMeter() {

    [4, 3, 2].forEach(function (nb) { s.push(fillFor(nb)); });

    }));
    s.push(stepBuild({

    }));

  }

  var FNAMES = ['Pulgar', 'Índice', 'Medio', 'Anular', 'Meñique'];

  function handSVG(h, o) {
    o = o || {};
    var mir = h === 'LH';
    function X(x) { return mir ? 360 - x : x; }
    var F = { 2: { x: 118, y: 42, hh: 74 }, 3: { x: 166, y: 28, hh: 88 }, 4: { x: 214, y: 40, hh: 76 }, 5: { x: 262, y: 58, hh: 58 } };
    var s = '<svg class="hand" viewBox="0 0 360 172" role="group" aria-label="' + (h === 'RH' ? 'Mano derecha' : 'Mano izquierda') + '">';
    s += '<rect class="palm" x="70" y="104" width="220" height="62" rx="28"/>';
    function fing(f, inner) {
      var cls = 'fing' + (o.sel === f ? ' sel' : '') + (o.seen && o.seen[f] ? ' seen' : '') + (o.tap ? ' tap' : '');
      return '<g class="' + cls + '" data-f="' + f + '"' + (o.tap ? ' role="button" tabindex="0" aria-label="Dedo ' + f + ', ' + FNAMES[f - 1] + '"' : '') + '>' + inner + '</g>';
    }
    [2, 3, 4, 5].forEach(function (f) {
      var d = F[f], cx = X(d.x);
      s += fing(f, '<rect class="fng" x="' + (cx - 19) + '" y="' + d.y + '" width="38" height="' + d.hh + '" rx="19"/>' + (o.nums === false ? '' : '<text class="fnum" x="' + cx + '" y="' + (d.y + 27) + '">' + f + '</text>'));

    var s = '<svg class="rs" viewBox="0 0 360 ' + (rows.length * 34 + 10) + '" role="img" aria-label="Comparación de duración y volumen">';
    rows.forEach(function (r, i) {
      var y = 8 + i * 34;
      s += '<text class="lbl" x="8" y="' + (y + 16) + '">' + r.l + '</text><rect class="seg" x="140" y="' + y + '" width="212" height="22" rx="4"/>';
      if (r.v > 0) s += '<rect class="seg now" x="140" y="' + y + '" width="' + (212 * r.v) + '" height="22" rx="4"/>';
    });
    return s + '</svg>';
  }
  // Demostración con dos botones (sin pedal / con pedal).
  function stepPedalDemo(c) {
    return function () {
      stageEl.innerHTML = head(c.kicker, c.title, c.lead) + figBox('fig') +
        '<div class="tools"><button class="btn ghost" id="off">' + c.offLabel + '</button><button class="btn" id="on">' + c.onLabel + '</button></div>' + fbBox();
      var fig = $('fig'), heard = {}, n = 0, playing = false, bOff = $('off'), bOn = $('on');
      function draw(on, rows) { var o = {}; o[c.key] = on; fig.innerHTML = pedalSVG({ sel: c.key, on: o }) + barsSVG(rows); }
      draw(false, c.rows(null));
      setFb('info', 'Compara', 'Pulsa los dos botones y escucha la diferencia.');
      function run(on) {
        if (playing) return; playing = true; bOff.disabled = true; bOn.disabled = true; clearTimers();
        draw(on, c.rows(on)); c.play(on);
        timers.push(setTimeout(function () {
          playing = false; bOff.disabled = false; bOn.disabled = false;
          var k = on ? 'on' : 'off'; if (!heard[k]) { heard[k] = 1; n++; }
          var txt = on ? c.txtOn : c.txtOff;
          if (n === 2) { setFb('ok', on ? c.onLabel : c.offLabel, txt + ' ' + c.done); unlock(); } else setFb('info', on ? c.onLabel : c.offLabel, txt + ' Prueba la otra opción.');
        }, c.ms));
      }
      bOff.addEventListener('click', function () { run(false); });
      bOn.addEventListener('click', function () { run(true); });
    };
  }
  function stepPedalIntro() {
    return function () {
      stageEl.innerHTML = head('Paso 1', 'Los tres pedales', 'Un piano de cola tiene tres pedales, que se pisan con el pie. De izquierda a derecha: <b>una corda</b>, <b>sostenuto</b> y <b>de resonancia</b>. Toca cada uno.') + figBox('fig') + fbBox();
      var sel = null, seen = {}, n = 0, fig = $('fig');
      function draw() { fig.innerHTML = pedalSVG({ tap: true, sel: sel, on: sel ? (function () { var o = {}; o[sel] = true; return o; })() : null }); }
      function pickP(e) {
        var g = e.target.closest ? e.target.closest('.pedal') : null; if (!g) return;
        sel = g.getAttribute('data-p'); if (!seen[sel]) { seen[sel] = 1; n++; }
        draw(); var p = PED[sel], txt = p.d;
        if (n === 3) { setFb('ok', p.n + ' (' + p.a + ')', txt + ' Ya conoces los tres.'); unlock(); } else setFb('info', p.n + ' (' + p.a + ')', txt + ' Faltan ' + (3 - n) + '.');
      }
      fig.addEventListener('click', pickP);
      fig.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickP(e); } });
      draw(); setFb('info', 'Toca un pedal', 'Al tocarlo se baja, como cuando lo pisas.');
    };
  }
  function demoSustain(on) { [60, 64, 67].forEach(function (m) { playNote(m, on ? 3.4 : 0.35); }); }
  function demoUna(on) {
    var ph = [64, 67, 72, 67, 64];
    ph.forEach(function (m, i) { timers.push(setTimeout(function () { playNote(m, 0.45, on ? { gain: 0.5, dark: 0.45 } : null); }, i * 430)); });
  }
  function demoSost(on) {
    playNote(60, on ? 3.4 : 0.5); playNote(64, on ? 3.4 : 0.5);
    timers.push(setTimeout(function () { playNote(67, 0.35); }, 900));
    timers.push(setTimeout(function () { playNote(69, 0.35); }, 1500));
  }
  function stepPedalMarks() {
    return function () {
      stageEl.innerHTML = head('Paso 5', 'Cómo se escribe el pedal', 'En la partitura, <b>Ped.</b> significa pisar el pedal derecho y el signo <b>✱</b> significa soltarlo. La línea entre los dos marca cuánto dura. Escucha la misma frase sin pedal y con pedal.') +
        figBox('fig') + '<div class="tools"><button class="btn ghost" id="off">Sin pedal</button><button class="btn" id="on">Con Ped. … ✱</button></div>' + fbBox();
      var fig = $('fig'), heard = {}, n = 0, playing = false, bOff = $('off'), bOn = $('on');
      var ST = [-2, 0, 2, 5], XS = [110, 165, 220, 275], MS = [60, 64, 67, 72];
      var MARK = '<text class="pedmark" x="40" y="160">Ped.</text><line class="sl" x1="82" x2="300" y1="154" y2="154"/><text class="pedmark" x="310" y="160">✱</text>';
      function draw(on) { fig.innerHTML = staffSVG({ notes: ST.map(function (s, i) { return { step: s, x: XS[i] }; }), extra: on ? MARK : '', label: 'Cuatro notas con y sin pedal' }); }
      draw(false); setFb('info', 'Compara', 'Son las mismas cuatro notas.');
      function run(on) {
        if (playing) return; playing = true; bOff.disabled = true; bOn.disabled = true; clearTimers(); draw(on);
        MS.forEach(function (m, i) { timers.push(setTimeout(function () { playNote(m, on ? 3.2 - i * 0.55 : 0.4); }, i * 550)); });
        timers.push(setTimeout(function () {
          playing = false; bOff.disabled = false; bOn.disabled = false;
          var k = on ? 'on' : 'off'; if (!heard[k]) { heard[k] = 1; n++; }
          var txt = on ? 'Con pedal las cuatro notas se quedan sonando juntas hasta el signo ✱.' : 'Sin pedal cada nota se corta cuando sueltas la tecla.';
          if (n === 2) { setFb('ok', on ? 'Con pedal' : 'Sin pedal', txt + ' Así se lee la indicación en la partitura.'); unlock(); } else setFb('info', on ? 'Con pedal' : 'Sin pedal', txt + ' Prueba la otra.');
        }, 4200));
      }
      bOff.addEventListener('click', function () { run(false); });
      bOn.addEventListener('click', function () { run(true); });
    };
  }
  function stepPedalChange() {
    return function () {
      stageEl.innerHTML = head('Paso 6', 'Cambiar el pedal con la armonía', 'Si el pedal se queda pisado mientras cambian los acordes, todo se mezcla. Lo correcto es <b>soltarlo y volver a pisarlo</b> justo cuando cambia el acorde. Escucha Do, Fa y Sol de las dos formas.') +
        figBox('fig') + '<div class="tools"><button class="btn ghost" id="off">Pedal siempre pisado</button><button class="btn" id="on">Pedal que cambia</button></div>' + fbBox();
      var fig = $('fig'), heard = {}, n = 0, playing = false, bOff = $('off'), bOn = $('on');
      var CH = [[60, 64, 67], [65, 69, 72], [67, 71, 74]], STP = [[-2, 0, 2], [1, 3, 5], [2, 4, 6]], XS = [110, 200, 290], T = [0, 1300, 2600];
      function marks(on) {
        if (on === null) return '';
        if (!on) return '<text class="pedmark" x="40" y="160">Ped.</text><line class="sl" x1="82" x2="318" y1="154" y2="154"/><text class="pedmark" x="326" y="160">✱</text>';
        var s = ''; XS.forEach(function (x) { s += '<text class="pedmark" x="' + (x - 30) + '" y="160">Ped.</text><line class="sl" x1="' + (x - 4) + '" x2="' + (x + 34) + '" y1="154" y2="154"/><text class="pedmark" x="' + (x + 38) + '" y="160">✱</text>'; });
        return s;
      }
      function draw(on) {
        var nt = []; STP.forEach(function (g, gi) { g.forEach(function (st) { nt.push({ step: st, x: XS[gi], nostem: true }); }); });
        fig.innerHTML = staffSVG({ notes: nt, extra: marks(on), label: 'Acordes de Do, Fa y Sol' });
      }
      draw(null); setFb('info', 'Compara', 'Escucha primero una forma y luego la otra.');
      function run(on) {
        if (playing) return; playing = true; bOff.disabled = true; bOn.disabled = true; clearTimers(); draw(on);
        CH.forEach(function (ch, gi) { timers.push(setTimeout(function () { ch.forEach(function (m) { playNote(m, on ? 1.25 : 3.9 - T[gi] / 1000); }); }, T[gi])); });
        timers.push(setTimeout(function () {
          playing = false; bOff.disabled = false; bOn.disabled = false;
          var k = on ? 'on' : 'off'; if (!heard[k]) { heard[k] = 1; n++; }
          var txt = on ? 'Cada acorde suena limpio porque el pedal se suelta justo cuando cambia la armonía.' : 'Los tres acordes se mezclan y el sonido queda borroso.';
          if (n === 2) { setFb('ok', on ? 'Pedal que cambia' : 'Pedal siempre pisado', txt + ' Regla: cambia el pedal cuando cambia el acorde.'); unlock(); } else setFb('info', on ? 'Pedal que cambia' : 'Pedal siempre pisado', txt + ' Prueba la otra.');
        }, 4600));
      }
      bOff.addEventListener('click', function () { run(false); });
      bOn.addEventListener('click', function () { run(true); });
    };
  }
  function stepPedalQ(k) {
    var QS = { L: 'Quieres tocar más suave y con un sonido más apagado.', R: 'Quieres que las notas sigan sonando aunque levantes las manos.', C: 'Quieres que suenen solo las notas que ya tienes pulsadas.' };
    return stepChoice({
      title: '¿Qué pedal usas?', lead: QS[k],
      fig: function (ok) { var st = {}; if (ok !== null) st[k] = ok ? 'ok' : 'bad'; return pedalSVG({ state: st }); },
      options: [{ k: 'L', t: 'Izquierdo (una corda)' }, { k: 'C', t: 'Central (sostenuto)' }, { k: 'R', t: 'Derecho (resonancia)' }], correct: k, cols: '1fr',
      hint: 'Piensa en lo que hace cada pedal.', wrong: 'Era el ' + PED[k].n.toLowerCase().replace('pedal ', ''),
      explain: '<b>' + PED[k].n + '</b> (' + PED[k].a + '). ' + PED[k].d
    });
  }
  function stepPedalEar(kind) {
    var NM = { N: 'Ningún pedal', L: 'Pedal izquierdo (una corda)', R: 'Pedal derecho (resonancia)' }, ph = [64, 67, 72];
    return stepEarPick({
      title: '¿Qué pedal suena?', lead: 'Pulsa ▶ y escucha tres notas. Decide si se usó algún pedal.',
      options: [{ k: 'N', t: NM.N }, { k: 'L', t: NM.L }, { k: 'R', t: NM.R }], correct: kind, cols: '1fr',
      play: function () {
        ph.forEach(function (m, i) {
          timers.push(setTimeout(function () {
            if (kind === 'R') playNote(m, 3.3 - i * 0.5); else if (kind === 'L') playNote(m, 0.4, { gain: 0.5, dark: 0.45 }); else playNote(m, 0.4);
          }, i * 500));
        });
      }, ms: 3400,
      hint: 'Con el derecho las notas se quedan sonando; con el izquierdo suenan más suaves.', wrong: 'Era: ' + NM[kind].toLowerCase(),
      explain: kind === 'R' ? 'Las notas siguieron sonando después de soltarlas: <b>pedal derecho</b>.' : kind === 'L' ? 'Sonó más suave y apagado: <b>pedal izquierdo</b> (una corda).' : 'Cada nota se cortó al soltarla y con volumen normal: <b>ningún pedal</b>.'
    });
  }
  function stepPedalMarkQ() {
    return stepChoice({
      title: 'Leer la partitura', lead: 'Bajo el pentagrama aparece <b>Ped.</b> al comienzo de una frase y <b>✱</b> al final. ¿Qué indica el signo ✱?',
      fig: function (ok) { return staffSVG({ notes: [{ step: -2, x: 120 }, { step: 1, x: 190 }, { step: 4, x: 260 }], extra: '<text class="pedmark" x="40" y="160">Ped.</text><line class="sl" x1="82" x2="300" y1="154" y2="154"/><text class="pedmark" x="310" y="160">✱</text>', label: 'Pedal indicado en la partitura' }); },
      options: [{ k: 'a', t: 'Soltar el pedal' }, { k: 'b', t: 'Pisar el pedal' }, { k: 'c', t: 'Tocar más fuerte' }, { k: 'd', t: 'Repetir la frase' }], correct: 'a', cols: '1fr 1fr',
      hint: 'Ped. es pisar; el otro signo es lo contrario.', wrong: 'Era soltar el pedal',
      explain: '<b>Ped.</b> pisa el pedal y <b>✱</b> lo suelta. La línea entre ambos marca el tiempo que dura.'
    });
  }
  function stepPedalWhenQ() {
    return stepChoice({
      title: '¿Cuándo cambiar el pedal?', lead: 'Estás tocando una pieza con el pedal derecho y la armonía cambia de Do a Fa. ¿Qué haces?',
      fig: function (ok) { var nt = []; [[-2, 0, 2], [1, 3, 5]].forEach(function (g, gi) { g.forEach(function (st) { nt.push({ step: st, x: 150 + gi * 100, nostem: true, state: ok === null ? '' : ok ? 'ok' : '' }); }); }); return staffSVG({ notes: nt, label: 'Cambio de acorde de Do a Fa' }); },
      options: [{ k: 'a', t: 'Suelto y piso de nuevo justo al cambiar el acorde' }, { k: 'b', t: 'Lo dejo pisado todo el rato' }, { k: 'c', t: 'Lo suelto y no lo uso más' }, { k: 'd', t: 'Lo piso solo al final de la pieza' }], correct: 'a', cols: '1fr',
      hint: 'Los acordes distintos no deben mezclarse.', wrong: 'Era soltar y pisar al cambiar',
      explain: 'Se cambia el pedal <b>cuando cambia la armonía</b>: así cada acorde suena limpio y sin mezclarse con el anterior.'
    });
  }
  function buildPedals() {
    var s = [stepPedalIntro()];
    s.push(stepPedalDemo({
      kicker: 'Paso 2', title: 'El pedal derecho: resonancia', key: 'R',
      lead: 'Al pisar el pedal derecho se levantan los apagadores y las cuerdas siguen vibrando aunque sueltes las teclas. Toca un acorde de Do mayor con y sin pedal.',
      offLabel: 'Sin pedal', onLabel: 'Con pedal derecho', ms: 3800,
      rows: function (on) { return [{ l: 'Tecla pulsada', v: on === null ? 0 : 0.35 / 3.6 }, { l: 'Sonido', v: on === null ? 0 : (on ? 3.4 : 0.35) / 3.6 }]; },
      play: demoSustain,
      txtOff: 'Al soltar la tecla, el apagador detiene la cuerda y el sonido se corta.',
      txtOn: 'El sonido sigue mucho después de soltar la tecla y se apaga poco a poco.', done: 'Es el pedal que más usarás.'
    }));
    s.push(stepPedalDemo({
      kicker: 'Paso 3', title: 'El pedal izquierdo: una corda', key: 'L',
      lead: 'El pedal izquierdo desplaza el mecanismo y los martillos golpean menos cuerdas. El resultado es un sonido más suave y apagado. Escucha una frase corta.',
      offLabel: 'Sin pedal', onLabel: 'Con pedal izquierdo', ms: 2500,
      rows: function (on) { return [{ l: 'Volumen', v: on === null ? 0 : (on ? 0.5 : 1) }, { l: 'Brillo', v: on === null ? 0 : (on ? 0.45 : 1) }]; },
      play: demoUna,
      txtOff: 'Volumen y brillo normales.', txtOn: 'Baja el volumen y el timbre se vuelve más oscuro y delicado.', done: 'Úsalo en pasajes suaves.'
    }));
    s.push(stepPedalDemo({
      kicker: 'Paso 4', title: 'El pedal central: sostenuto', key: 'C',
      lead: 'El pedal central mantiene solo las notas que ya estaban pulsadas cuando lo pisas. Aquí se pulsan Do y Mi, se pisa el pedal, se sueltan las teclas y luego se tocan Sol y La.',
      offLabel: 'Sin pedal', onLabel: 'Con pedal central', ms: 2600,
      rows: function (on) { return [{ l: 'Do y Mi', v: on === null ? 0 : (on ? 0.94 : 0.14) }, { l: 'Sol y La', v: on === null ? 0 : 0.1 }]; },
      play: demoSost,
      txtOff: 'Todas las notas se cortan al soltar las teclas.', txtOn: 'Do y Mi siguen sonando, pero Sol y La, tocadas después, se cortan normal.', done: 'Se usa poco; en muchos pianos verticales no funciona así.'
    }));
    s.push(stepPedalMarks(), stepPedalChange());
    shuffle(['L', 'C', 'R']).forEach(function (k) { s.push(stepPedalQ(k)); });
    pick(['N', 'L', 'R'], 2).forEach(function (k) { s.push(stepPedalEar(k)); });
    s.push(stepPedalMarkQ(), stepPedalWhenQ());
    s.push(stepSummary(10, {
      title: 'Ya conoces los pedales',
      fig: pedalSVG({ tap: true }),
      hint: 'Izquierdo: suave. Central: sostenuto. Derecho: resonancia. Toca uno para recordar su función.',
      bindFig: function (r) {
        r.addEventListener('click', function (e) {
          var g = e.target.closest ? e.target.closest('.pedal') : null; if (!g) return;
          var k = g.getAttribute('data-p'); r.innerHTML = pedalSVG({ tap: true, sel: k, on: (function () { var o = {}; o[k] = true; return o; })() });
          var h = document.querySelector('.hint'); if (h) h.innerHTML = '<b>' + PED[k].n + ':</b> ' + PED[k].d;
        });
      }
    }));
    return s;
  }


  var BUILD = { 1: buildL1, 2: buildBass, 3: buildValues, 4: buildMeter, 5: buildL2, 6: buildL3, 7: buildFinger, 8: buildIntervals, 9: buildChords, 10: buildPedals };

  function startLesson(n) {
    lessonN = n; pianoOn = n >= 7; results = []; curClef = n === 2 ? 'bass' : 'treble'; frame();
    steps = BUILD[n]();
    go(0);
  }

  home();
})();
