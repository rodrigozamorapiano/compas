<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Compás</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
html, body { margin: 0; height: 100%; }

/* Diseño único en negro: fondo negro, títulos en amarillo dorado, pentagrama y teclas en tonos claros.
   Inicio = pentagrama de bienvenida + ruta de lecciones. Lección = progreso arriba, figura al centro, botón abajo. */
:root {
  --bg: #000000;
  --surface: #0D0D10;
  --ink: #F2F2F6;
  --muted: #A0A0AE;
  --line: #2C2C33;
  --staff: #E9EAF0;
  --gold: #C9A04A;
  --accent: #C9A04A;
  --accent-ink: #0A0A0A;
  --accent-soft: rgba(201, 160, 74, .2);
  --ok: #5FD39A;
  --ok-soft: rgba(95, 211, 154, .17);
  --bad: #FF8F78;
  --bad-soft: rgba(255, 143, 120, .17);
  --key: #F1F1F5;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-block: 12px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .nt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 600px; margin: 0 auto; min-width: 0; }
[hidden] { display: none !important; }
h1, h2, h3 { color: var(--gold); }

/* Pentagrama */
.staff, .kb { width: 100%; height: auto; display: block; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.sl { stroke: var(--staff); stroke-width: 1.5; }
.clef path { fill: var(--staff); }
.band { fill: var(--accent-soft); }
.band.ok { fill: var(--ok-soft); }
.band.bad { fill: var(--bad-soft); }
.nt { color: var(--staff); }
.nt .head { fill: currentColor; }
.nt .stem { stroke: currentColor; stroke-width: 1.7; }
.nt .led { stroke: var(--staff); stroke-width: 1.5; }
.nt .hit { fill: transparent; }
.nt.tap { cursor: pointer; }
.nt.active, .nt.ghost { color: var(--accent); }
.nt.ok { color: var(--ok); }
.nt.bad { color: var(--bad); }
.nt:focus-visible { outline: none; }
.nt:focus-visible .hit { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
.lbl { font: 700 13px var(--f-body); fill: var(--ink); }
.acc { color: var(--staff); }
.nt .acc { color: inherit; }
.acc line { stroke: currentColor; stroke-width: 1.7; }
.acc .bar { stroke-width: 3.6; }
.acc path { stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; }

/* Teclado */
.key { cursor: pointer; }
.key.w rect { fill: var(--key); stroke: #050505; stroke-width: 1.5; }
.key.b rect { fill: #1A1A20; stroke: #666672; stroke-width: 1; }
.key.seen.w rect { fill: #E4D2A2; }
.key.seen.b rect { fill: #6B5528; }
.key.active rect { fill: var(--accent); }
.key.ok rect { fill: var(--ok); }
.key.bad rect { fill: var(--bad); }
.key text { font: 700 12.5px var(--f-body); text-anchor: middle; pointer-events: none; fill: #101014; }
.key.b text { fill: #fff; font-size: 9.5px; }
.key.b.active text, .key.b.ok text, .key.b.bad text { fill: #101014; }
.key:focus-visible { outline: none; }
.key:focus-visible rect { stroke: var(--accent); stroke-width: 3; }

/* Inicio */
.hero { padding-top: 8px; }
.hero .fig { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 8px 4px; }
.hero h1 { font: 800 clamp(48px, 14vw, 76px)/.95 var(--f-display); letter-spacing: -.035em; margin: 22px 0 10px; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); max-width: 46ch; font-size: 17px; }
.hint { font-size: 13px; color: var(--muted); margin: 6px 4px 0; text-align: center; }
.path-title { font: 700 12px var(--f-body); letter-spacing: .12em; text-transform: uppercase; margin: 34px 0 14px; }
.path { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.path li { display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 14px; position: relative; padding-bottom: 18px; }
.path li:last-child { padding-bottom: 0; }
.path li::before { content: ""; position: absolute; left: 19px; top: 40px; bottom: 0; width: 2px; background: var(--line); }
.path li:last-child::before { display: none; }
.node { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 700 17px var(--f-display); background: var(--surface); border: 2px solid var(--line); color: var(--muted); }
.path .open .node { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.path .done .node { background: var(--ok); border-color: var(--ok); color: #06140D; }
.lesson { min-width: 0; padding-top: 6px; }
.lesson h3 { margin: 0; font: 700 18px/1.25 var(--f-display); text-wrap: balance; }
.lesson p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.lesson .soon { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: inline-block; margin-top: 6px; }
.path li:not(.open):not(.done) .lesson h3 { color: var(--muted); }
.open .lesson, .done .lesson { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.open .lesson .btn, .done .lesson .btn { margin-top: 14px; }
.best { font-size: 14px; color: var(--ok); font-weight: 700; margin-top: 8px; }

/* Botones */
.btn { appearance: none; border: 0; border-radius: 12px; padding: 14px 22px; font-weight: 700; font-size: 16px; background: var(--accent); color: var(--accent-ink); min-height: 50px; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.btn.ghost:hover:not(:disabled) { border-color: var(--accent); filter: none; }
.btn.wide { width: 100%; }

/* Lección */
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.icon-btn { width: 42px; height: 42px; flex: none; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 18px; line-height: 1; }
.icon-btn[aria-pressed="false"] { color: var(--muted); }
.bar { flex: 1; height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; min-width: 0; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .35s ease; }
.kicker { font: 700 12px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 0 0 6px; }
h2 { font: 800 clamp(26px, 6.5vw, 34px)/1.1 var(--f-display); letter-spacing: -.02em; margin: 0 0 10px; text-wrap: balance; }
.lead { margin: 0 0 18px; font-size: 17px; max-width: 52ch; }
.fig { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 8px 6px; }
.fig + .fig { margin-top: 10px; }
.fb { margin-top: 14px; min-height: 4.6em; border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.fb.info { background: var(--accent-soft); }
.fb.ok { background: var(--ok-soft); }
.fb.bad { background: var(--bad-soft); }
.fb b.k { display: block; font: 700 15px var(--f-display); margin-bottom: 1px; }
.fb.ok b.k { color: var(--ok); }
.fb.bad b.k { color: var(--bad); }
.fb.info b.k { color: var(--gold); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; min-height: 64px; font: 700 24px var(--f-display); display: flex; align-items: center; justify-content: center; flex-wrap: wrap; column-gap: 8px; padding: 6px 8px; }
.opt small { font: 500 13px var(--f-body); color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.dim { opacity: .5; }
.tools { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.tools .btn { flex: 1 1 120px; }
.tools .nudge { flex: 0 0 56px; padding-inline: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 15px; min-height: 40px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--gold); }
.chip.seen { border-color: #4F4120; }
.pat { display: flex; gap: 6px; margin-top: 10px; }
.pat span { text-align: center; font: 700 15px var(--f-display); padding: 8px 0; border-radius: 8px; background: var(--surface); border: 2px solid var(--line); color: var(--muted); min-width: 0; }
.pat span.T { flex: 2; }
.pat span.S { flex: 1; }
.pat span.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.pat span.cur { border-color: var(--accent); color: var(--gold); background: var(--accent-soft); }
.dock { max-width: 600px; margin: 16px auto 0; display: flex; }
.score { font: 800 64px/1 var(--f-display); letter-spacing: -.03em; margin: 4px 0 6px; color: var(--gold); }
.score span { font-size: 28px; color: var(--muted); font-weight: 600; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.stack { display: grid; gap: 10px; margin-top: 16px; }
.stack .row2 { margin-top: 0; }
@media (max-width: 380px) { .row2 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

</head>

  // ---------- Dibujo: teclado ----------
  function kbLayout(start, whites) {
    var keys = [], ws = [], m = start, WPC = [0, 2, 4, 5, 7, 9, 11];
    while (ws.length < whites) { if (WPC.indexOf(pcOf(m)) >= 0) ws.push(m); m++; }
    var kw = (KB_W - 8) / whites;
    ws.forEach(function (mm, i) {
      keys.push({ midi: mm, black: false, x: 4 + i * kw, w: kw });
      if (i < whites - 1 && ws[i + 1] - mm === 2) keys.push({ midi: mm + 1, black: true, x: 4 + (i + 1) * kw - kw * 0.3, w: kw * 0.6 });
    });
    return keys;
  }
  function keyboardSVG(o) {

    [false, true].forEach(function (blk) {
      keys.forEach(function (k) {
        if (k.black !== blk) return;
        s += '<g class="key ' + (blk ? 'b' : 'w') + ' ' + (marks[k.midi] || '') + '" data-m="' + k.midi + '" role="button" tabindex="0" aria-label="' + nameOf(k.midi) + '">' +
          '<rect x="' + k.x + '" y="4" width="' + k.w + '" height="' + (blk ? 84 : 132) + '" rx="' + (blk ? 3 : 4) + '"/>';
        if (labels[k.midi]) s += '<text x="' + (k.x + k.w / 2) + '" y="' + (blk ? 74 : 122) + '">' + labels[k.midi] + '</text>';
        s += '</g>';

    });

  }
  function bindKeys(root, fn) {

    });
    svg.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var g = e.target.closest ? e.target.closest('.key') : null;
      if (g) { e.preventDefault(); fn(+g.getAttribute('data-m')); }
    });
  }

  // ---------- Estado y progreso ----------
  var app = document.getElementById('app');

      }

  }

  }

  // ---------- Inicio ----------
  var COURSE = [

  function home() {

  function figHTML() { return '<div class="fig" id="fig"></div><div class="fb info" id="fb" role="status" aria-live="polite"></div>'; }

  // ---------- Pasos genéricos ----------
  // Pregunta de opción múltiple. c.fig(estado) devuelve el HTML de la figura (estado: null, true o false).
  function stepChoice(c) {

  // ===================== LECCIÓN 1 =====================
  function stepIntro() {
    stageEl.innerHTML = head('Paso 1', 'El pentagrama', 'Es el conjunto de <b>5 líneas</b> y <b>4 espacios</b> donde viven las notas. Se numeran de abajo hacia arriba. Toca el pentagrama para explorarlo.') + figHTML();
    var seen = {}, count = 0, fig = $('fig');
    function draw(band) {
      fig.innerHTML = staffSVG({ clef: false, bands: band === undefined ? [] : [{ step: band }] });
      bind(fig, { onPos: function (st) {
        if (st < 0 || st > 8) return;
        if (!seen[st]) { seen[st] = 1; count++; }
        draw(st);
        setFb('info', st % 2 === 0 ? 'Línea ' + (st / 2 + 1) : 'Espacio ' + ((st + 1) / 2), count >= 4 ? 'Muy bien, ya lo entiendes.' : 'Toca otras posiciones. Faltan ' + (4 - count) + '.');
        if (count >= 4) unlock();
      } });
    }
    draw(); setFb('info', 'Cuenta desde abajo', 'La línea de más abajo es la línea 1. El primer espacio está entre la línea 1 y la 2.');
  }

  function stepClef(c) {
    return function () {
      stageEl.innerHTML = head(c.kicker, c.title, c.lead) + figHTML();
      var fig = $('fig'), done = false;
      function draw(b) { fig.innerHTML = staffSVG({ bands: b || [] }); bind(fig, { onPos: tap }); }
      function tap(st) {
        if (done) return;
        if (st === c.target) {
          done = true; draw([{ step: c.target, kind: 'ok' }]); play(st);
          setFb('ok', '¡Eso es!', c.okText);

        } else {
          draw([{ step: st, kind: 'bad' }]);

        }
      }
      draw(); setFb('info', 'Pista', c.hint);
    };
  }

  // Exploración de notas en el pentagrama. Cada elemento es un número (step) o {step, acc}.
  function stepExplore(kicker, title, lead, list, xs, doneMsg) {
    var items = list.map(function (v) { return typeof v === 'number' ? { step: v, acc: 0 } : v; });
    return function () {
      stageEl.innerHTML = head(kicker, title, lead) + figHTML();
      var fig = $('fig'), revealed = {}, n = 0, cur = -1;
      function draw() {
        var notes = items.map(function (it, i) {
          return { step: it.step, acc: it.acc, x: xs[i], tap: true, aria: accName(it.step, it.acc) + ', ' + loc(it.step), state: i === cur ? 'active' : '', label: revealed[i] ? accName(it.step, it.acc) : '' };
        });
        fig.innerHTML = staffSVG({ notes: notes });
        bind(fig, { onNote: function (i) {
          var it = items[i], d = info(it.step);
          cur = i; if (!revealed[i]) { revealed[i] = 1; n++; }
          play(it.step, it.acc); draw();
          var ttl = accName(it.step, it.acc) + ' (' + d.letter + accSym(it.acc) + ')';
          var extra = it.acc > 0 ? ' El sostenido la sube un semitono.' : it.acc < 0 ? ' El bemol la baja un semitono.' : '';
          if (n === items.length) { setFb('ok', ttl, 'Está en ' + loc(it.step) + '.' + extra + ' ' + doneMsg); unlock(); }
          else setFb('info', ttl, 'Está en ' + loc(it.step) + '.' + extra + ' Faltan ' + (items.length - n) + ' por tocar.');
        } });

    };
  }

  function stepName(st, clef) {
    clef = clef || curClef;

    var opts = pick(LETTERS.filter(function (l) { return l !== d.letter; }), 3).concat([d.letter]);
    opts.sort(function (a, b) { return LETTERS.indexOf(a) - LETTERS.indexOf(b); });

    return stepChoice({
      title: '¿Qué nota es?', lead: 'Mírala en el pentagrama' + (clef === 'bass' ? ' (<b>clave de fa</b>)' : '') + ' y elige su nombre.',

      options: opts.map(function (l) { return { k: l, t: ES[l] }; }), correct: d.letter,

  }

  function stepPlace(letter) {
    return function () {
      var name = ES[letter];
      stageEl.innerHTML = head('Coloca la nota', name, 'Toca el pentagrama donde va el <b>' + name + '</b>. Sirve cualquier ' + name + ' que quepa.') +
        figBox('fig') + '<div class="tools"><button class="btn ghost nudge" id="up" aria-label="Subir la nota">▲</button><button class="btn ghost nudge" id="dn" aria-label="Bajar la nota">▼</button><button class="btn" id="chk" disabled>Comprobar</button></div>' + fbBox();

      if (right === undefined) right = cands[0];

        var notes = [];

          notes.push({ step: ghost, x: ok ? 210 : 170, state: ok ? 'ok' : 'bad', label: ok ? name : info(ghost).es });

  function buildL1() {

  // ===================== Pasos de teclado (lecciones 2 y 3) =====================
  function stepKeyFind(c) {
    return function () {
      stageEl.innerHTML = head(c.kicker, c.title, c.lead) + figHTML();
      var fig = $('fig'), done = false;
      function draw(m, st) {
        var marks = {}; if (m !== null) marks[m] = st;
        fig.innerHTML = keyboardSVG({ start: 60, whites: 8, marks: marks });
        bindKeys(fig, tap);
      }
      function tap(m) {
        if (done) return;
        playMidi(m);
        if (pcOf(m) === c.pc) { done = true; draw(m, 'ok'); setFb('ok', '¡Eso es!', c.okText); unlock(); }
        else { draw(m, 'bad'); setFb('bad', 'Casi', 'Tocaste ' + nameOf(m) + '. ' + c.hint); }
      }
      draw(null); setFb('info', 'Pista', c.hint);
    };
  }

  function stepKeyExplore(c) {
    return function () {
      stageEl.innerHTML = head(c.kicker, c.title, c.lead) + figHTML();
      var fig = $('fig'), seen = {}, n = 0, cur = null;
      function draw() {
        var marks = {}, labels = {};
        Object.keys(seen).forEach(function (k) { marks[k] = 'seen'; if (c.label) labels[k] = c.label(+k); });
        if (cur !== null) marks[cur] = 'active';
        fig.innerHTML = keyboardSVG({ start: 60, whites: 8, marks: marks, labels: labels });
        bindKeys(fig, tap);
      }
      function tap(m) {
        playMidi(m);
        if (!c.allowed(m)) { setFb('info', nameOf(m), c.notAllowed); return; }
        cur = m; if (!seen[m]) { seen[m] = 1; n++; }
        draw();
        var d = c.describe(m);
        if (n >= c.need) { setFb('ok', d[0], d[1] + ' ' + c.doneText); unlock(); }
        else setFb('info', d[0], d[1] + ' Faltan ' + (c.need - n) + '.');
      }
      draw(); setFb('info', c.startTitle, c.startText);
    };
  }

  function stepPairs(c) {

  function stepStaffToKey(it) {

  function stepSemitones(a, b) {

  // ===================== LECCIÓN 3 =====================
  var C_SCALE = [60, 62, 64, 65, 67, 69, 71, 72], C_NAMES = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si', 'Do'];
  var PAT = ['T', 'T', 'S', 'T', 'T', 'T', 'S'];
  var KEYS = [
    { k: 'C', name: 'Do mayor', sharps: [], flats: [], desc: 'no lleva sostenidos ni bemoles (solo teclas blancas).', scale: [60, 62, 64, 65, 67, 69, 71, 72] },
    { k: 'G', name: 'Sol mayor', sharps: [8], flats: [], desc: '1 sostenido: Fa♯.', scale: [67, 69, 71, 72, 74, 76, 78, 79] },
    { k: 'D', name: 'Re mayor', sharps: [8, 5], flats: [], desc: '2 sostenidos: Fa♯ y Do♯.', scale: [62, 64, 66, 67, 69, 71, 73, 74] },
    { k: 'F', name: 'Fa mayor', sharps: [], flats: [4], desc: '1 bemol: Si♭.', scale: [65, 67, 69, 70, 72, 74, 76, 77] },
    { k: 'B', name: 'Si♭ mayor', sharps: [], flats: [4, 7], desc: '2 bemoles: Si♭ y Mi♭.', scale: [70, 72, 74, 75, 77, 79, 81, 82] }
  ];
  function patChips(done, cur) {
    return PAT.map(function (t, i) { return '<span class="' + t + (i < done ? ' on' : '') + (i === cur ? ' cur' : '') + '">' + t + '</span>'; }).join('');
  }

  function stepScaleWalk() {
    return function () {
      stageEl.innerHTML = head('Paso 1', 'La escala mayor', 'Una <b>escala</b> es una serie de notas ordenadas. La escala <b>mayor</b> sube con este patrón: <b>T T S T T T S</b>, donde T es un tono (2 semitonos) y S un semitono. Recórrela nota por nota.') +
        figBox('fig') + '<div class="pat" id="pat"></div><div class="tools"><button class="btn" id="nx">Siguiente nota ▶</button><button class="btn ghost" id="all">▶ Escuchar todo</button></div>' + fbBox();
      var fig = $('fig'), cur = 0;
      function draw() {
        var marks = {}, labels = {};
        for (var i = 0; i <= cur; i++) { marks[C_SCALE[i]] = i === cur ? 'active' : 'seen'; labels[C_SCALE[i]] = C_NAMES[i]; }
        fig.innerHTML = keyboardSVG({ start: 60, whites: 8, marks: marks, labels: labels });
        $('pat').innerHTML = patChips(cur, cur < 7 ? cur : -1);
        bindKeys(fig, playMidi);
      }
      draw(); playMidi(60);
      setFb('info', 'Empieza en Do', 'Esta es la <b>tónica</b>, la nota donde empieza la escala. Pulsa “Siguiente nota”.');
      $('nx').addEventListener('click', function () {
        if (cur >= 7) return;
        cur++; playMidi(C_SCALE[cur]); draw();
        var t = PAT[cur - 1];
        var txt = C_NAMES[cur - 1] + ' → ' + C_NAMES[cur] + ': ' + (t === 'T' ? 'tono (2 semitonos)' : 'semitono (1)');
        if (cur === 7) { $('nx').disabled = true; setFb('ok', '¡Escala completa!', txt + '. Esa es la escala de Do mayor: T T S T T T S.'); unlock(); }
        else setFb('info', txt, 'Faltan ' + (7 - cur) + ' notas.');
      });
      $('all').addEventListener('click', function () {
        playSeq(C_SCALE, 420, function (i) {
          var marks = {}, labels = {};
          for (var j = 0; j <= i; j++) { marks[C_SCALE[j]] = j === i ? 'active' : 'seen'; labels[C_SCALE[j]] = C_NAMES[j]; }
          fig.innerHTML = keyboardSVG({ start: 60, whites: 8, marks: marks, labels: labels });
          bindKeys(fig, playMidi);
        });
      });
    };
  }

  function stepToneOrSemi(i) {
    var a = C_SCALE[i], b = C_SCALE[i + 1], t = PAT[i];
    return stepChoice({
      title: '¿Tono o semitono?', lead: 'En Do mayor, de <b>' + C_NAMES[i] + '</b> a <b>' + C_NAMES[i + 1] + '</b>.',
      fig: function (ok) { var m = {}; var st = ok === null ? 'active' : ok ? 'ok' : 'bad'; m[a] = st; m[b] = st; return keyboardSVG({ start: 60, whites: 8, marks: m }); },
      options: [{ k: 'T', t: 'Tono', s: '2 semitonos' }, { k: 'S', t: 'Semitono', s: '1 semitono' }], correct: t,
      hint: 'Recuerda: Mi–Fa y Si–Do están pegadas.', wrong: 'Era ' + (t === 'T' ? 'tono' : 'semitono'),
      explain: 'De ' + C_NAMES[i] + ' a ' + C_NAMES[i + 1] + ' hay ' + plural(b - a, 'semitono', 'semitonos') + ': es un <b>' + (t === 'T' ? 'tono' : 'semitono') + '</b>.',
      sound: function () { playSeq([a, b], 550); }

  function stepScaleBuild(c) {
    return function () {
      var ints = [2, 2, 1, 2, 2, 2, 1], seq = [c.root];
      for (var i = 0; i < 7; i++) seq.push(seq[i] + ints[i]);
      stageEl.innerHTML = head('Construye', c.title, c.lead) + figBox('fig') + '<div class="pat" id="pat"></div>' + fbBox();
      var fig = $('fig'), pos = 1, mistakes = 0, flash = null, finished = false;
      function draw() {
        var marks = {}, labels = {};
        for (var j = 0; j < pos; j++) { marks[seq[j]] = j === pos - 1 ? 'active' : 'ok'; labels[seq[j]] = c.names[j]; }
        if (flash !== null) marks[flash] = 'bad';
        fig.innerHTML = keyboardSVG({ start: c.root, whites: 8, marks: marks, labels: labels, label: 'Teclado de la escala' });
        $('pat').innerHTML = patChips(Math.min(pos - 1, 7), pos < 8 ? pos - 1 : -1);
        bindKeys(fig, tap);
      }
      function tap(m) {
        if (finished) return;
        if (m === seq[pos]) {
          playMidi(m); flash = null; pos++; draw();
          if (pos === 8) {
            finished = true; results.push(mistakes === 0);
            setFb('ok', '¡Escala de ' + c.short + ' completa!', c.done); unlock();
          } else {
            var nt = PAT[pos - 1];
            setFb('info', '¡Bien!', 'Ahora sube un <b>' + (nt === 'T' ? 'tono (2 semitonos)' : 'semitono (1)') + '</b> desde ' + c.names[pos - 1] + '.');
          }
        } else {
          mistakes++; flash = m; playMidi(m); draw();
          var prev = seq[pos - 1], diff = m - prev, need = ints[pos - 1];
          setFb('bad', 'Esa no es', diff > 0 ? 'Esa tecla está a ' + plural(diff, 'semitono', 'semitonos') + ' de ' + c.names[pos - 1] + ', y el patrón pide ' + plural(need, 'semitono', 'semitonos') + ' (' + PAT[pos - 1] + ').' : 'La escala sube: busca a la derecha de ' + c.names[pos - 1] + '.');
          var my = pos; timers.push(setTimeout(function () { if (!finished && pos === my && flash === m) { flash = null; draw(); } }, 700));
        }
      }
      draw();
      setFb('info', 'Empieza en ' + c.names[0], 'Toca la siguiente nota siguiendo el patrón <b>T T S T T T S</b>. Primero: un tono (2 semitonos).');
    };
  }

        figBox('fig') + '<div class="tools"><button class="btn ghost" id="up7">▶ Sube hasta Si</button><button class="btn" id="home" disabled>🏠 Resolver en Do</button></div>' + fbBox();

  }

  function stepKeySig() {

      }

  function buildL3() {

      title: 'La nota que cambia', lead: 'En <b>Sol mayor</b>, para que el patrón T T S T T T S funcione, el Fa sube un semitono. ¿Cómo se llama esa nota?',
      fig: function (ok) { var m = {}; m[78] = ok === null ? 'active' : ok ? 'ok' : 'bad'; return keyboardSVG({ start: 67, whites: 8, marks: m }); },
      options: [{ k: 'Fa♯', t: 'Fa♯' }, { k: 'Fa♭', t: 'Fa♭' }, { k: 'Sol♭', t: 'Sol♭' }, { k: 'Mi♯', t: 'Mi♯' }], correct: 'Fa♯',
      hint: 'Subir un semitono se indica con ♯.', wrong: 'Era Fa♯',
      explain: 'Un semitono arriba de Fa es <b>Fa♯</b> (la tecla negra entre Fa y Sol). Sol mayor es la escala con Fa♯.', sound: function () { playMidi(78); }
    }));
    s.push(stepChoice({
      title: 'La nota que cambia', lead: 'Una canción está en <b>Fa mayor</b>. ¿Qué nota se toca siempre con bemol?',
      fig: function (ok) { var m = {}; if (ok !== null) m[70] = ok ? 'ok' : 'bad'; return keyboardSVG({ start: 65, whites: 8, marks: m }); },
      options: [{ k: 'Si♭', t: 'Si♭' }, { k: 'Mi♭', t: 'Mi♭' }, { k: 'La♭', t: 'La♭' }, { k: 'Re♭', t: 'Re♭' }], correct: 'Si♭',
      hint: 'La escala es Fa, Sol, La, ?, Do, Re, Mi, Fa.', wrong: 'Era Si♭',
      explain: 'En Fa mayor, el Si baja un semitono y es <b>Si♭</b>. Esa es la única alteración de la tonalidad.', sound: function () { playMidi(70); }
    }));
    var labels = {}; C_SCALE.forEach(function (m, i) { labels[m] = C_NAMES[i]; });
    s.push(stepSummary(4, {
      title: 'Ya conoces las tonalidades',
      fig: keyboardSVG({ start: 60, whites: 8, labels: labels }) + '<div class="pat">' + patChips(0, -1) + '</div>',
      hint: 'Do mayor y el patrón T T S T T T S. Toca las teclas para escucharlas.',
      bindFig: function (r) { bindKeys(r, playMidi); }
    }));
    return s;
  }


  // ===================== LECCIÓN 2: CLAVE DE FA =====================
  function stepMiddleC() {
    return function () {
      stageEl.innerHTML = head('Paso 2', 'El Do central une las dos claves',
        'La clave de sol se usa para los sonidos agudos y la de fa para los graves. El <b>Do central</b> es la misma tecla en ambas, pero se escribe distinto. Toca las dos notas.') +
        figBox('figT') + figBox('figB') + fbBox();
      var heard = { T: false, B: false };
      function draw() {
        $('figT').innerHTML = staffSVG({ clefType: 'treble', label: 'Do central en clave de sol',
          notes: [{ step: -2, x: 210, tap: true, state: heard.T ? 'ok' : '', label: 'Clave de sol', aria: 'Do central en clave de sol' }] });
        $('figB').innerHTML = staffSVG({ clefType: 'bass', label: 'Do central en clave de fa',
          notes: [{ step: 10, x: 210, tap: true, state: heard.B ? 'ok' : '', label: 'Clave de fa', aria: 'Do central en clave de fa' }] });
        bind($('figT'), { onNote: function () { heard.T = true; play(-2, 0, 'treble'); after('T'); } });
        bind($('figB'), { onNote: function () { heard.B = true; play(10, 0, 'bass'); after('B'); } });
      }
      function after(which) {
        draw();
        if (heard.T && heard.B) { setFb('ok', 'Es el mismo sonido', 'Arriba, el Do central queda en una línea adicional <b>debajo</b> del pentagrama. Abajo, en una línea adicional <b>encima</b>. Los dos suenan igual.'); unlock(); }
        else setFb('info', 'Do central', (which === 'T' ? 'En clave de sol, cuelga debajo de la línea 1.' : 'En clave de fa, cuelga encima de la línea 5.') + ' Falta tocar la otra.');
      }
      draw(); setFb('info', 'Toca las dos notas', 'Las dos son Do, y las dos suenan igual.');
    };
  }

  function stepCompare() {
    return function () {
      var POS = [{ s: 0, t: 'Línea 1' }, { s: 3, t: 'Espacio 2' }, { s: 4, t: 'Línea 3' }, { s: 8, t: 'Línea 5' }];
      stageEl.innerHTML = head('Paso 6', 'Misma posición, otro nombre',
        'Una nota en la misma posición del pentagrama se llama distinto según la clave. Elige una posición y compara.') +
        '<div class="chips" id="chips"></div>' + figBox('figT') + figBox('figB') + fbBox();
      var sel = 0, seen = { 0: 1 }, count = 1;
      function draw() {
        $('chips').innerHTML = POS.map(function (p, i) { return '<button class="chip' + (seen[i] ? ' seen' : '') + '" data-i="' + i + '" aria-pressed="' + (i === sel) + '">' + p.t + '</button>'; }).join('');
        var s = POS[sel].s, t = info(s, 'treble'), b = info(s, 'bass');
        $('figT').innerHTML = staffSVG({ clefType: 'treble', notes: [{ step: s, x: 210, label: t.es }], label: 'Clave de sol' });
        $('figB').innerHTML = staffSVG({ clefType: 'bass', notes: [{ step: s, x: 210, label: b.es }], label: 'Clave de fa' });
        var txt = POS[sel].t + ': en clave de sol es <b>' + t.es + '</b>; en clave de fa es <b>' + b.es + '</b>.';
        if (count >= 3) { setFb('ok', 'Cada clave tiene su lectura', txt + ' En clave de fa el nombre se corre dos letras más arriba (Mi → Sol, Si → Re).'); unlock(); }
        else setFb('info', 'Compara', txt + ' Prueba otras posiciones.');
      }
      $('chips').addEventListener('click', function (e) {
        var bt = e.target.closest ? e.target.closest('.chip') : null; if (!bt) return;
        sel = +bt.getAttribute('data-i'); if (!seen[sel]) { seen[sel] = 1; count++; }
        draw(); playSeq([midiOf(POS[sel].s, 0, 'treble'), midiOf(POS[sel].s, 0, 'bass')], 600);
      });
      draw();
    };
  }

  function buildBass() {
    var lines = pick([0, 2, 4, 6, 8], 3), spaces = pick([1, 3, 5, 7], 2);
    var quiz1 = shuffle(lines.concat(spaces));
    var letters = pick(LETTERS, 3);
    var mixed = shuffle(
      pick([-2, -1, 9, 10, 0, 1, 2, 3, 4, 5, 6, 7, 8], 3).map(function (st) { return { st: st, clef: 'bass' }; })
        .concat(pick([0, 1, 2, 3, 4, 5, 6, 7, 8], 2).map(function (st) { return { st: st, clef: 'treble' }; })));
    var s = [
      stepClef({
        kicker: 'Paso 1', title: 'La clave de fa',
        lead: 'Esta clave se usa para los sonidos graves. Sus <b>dos puntos</b> rodean una línea. <b>Tócala.</b>',
        target: 6, hint: 'Los puntos rodean la línea 4, contando desde abajo.', hintBad: 'Busca la línea que queda entre los dos puntos de la clave.',
        okText: 'Los dos puntos rodean la línea 4, y esa línea es <b>Fa</b>. Por eso se llama clave de fa.'
      }),
      stepMiddleC(),
      stepExplore('Paso 3', 'Las notas en las líneas', 'Con clave de fa, las cinco líneas de abajo hacia arriba son <b>Sol, Si, Re, Fa, La</b>. Toca cada una.', [0, 2, 4, 6, 8], [100, 150, 200, 250, 300], 'Repítelo en voz alta: Sol, Si, Re, Fa, La.'),
      stepExplore('Paso 4', 'Las notas en los espacios', 'Los cuatro espacios de abajo hacia arriba son <b>La, Do, Mi, Sol</b>. Toca cada uno.', [1, 3, 5, 7], [110, 175, 240, 305], 'Repítelo en voz alta: La, Do, Mi, Sol.')
    ];
    quiz1.forEach(function (st) { s.push(stepName(st)); });
    s.push(stepExplore('Paso 5', 'Más allá del pentagrama', 'Aquí también se usan líneas adicionales. Encima del pentagrama queda el <b>Do central</b>; debajo, <b>Fa</b> y <b>Mi</b>.', [-2, -1, 9, 10], [105, 165, 235, 295], 'Sigue el mismo orden: ... Mi, Fa, Sol, La, Si, Do.'));
    s.push(stepCompare());
    letters.forEach(function (l) { s.push(stepPlace(l)); });
    mixed.forEach(function (m) { s.push(stepName(m.st, m.clef)); });
    var map = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(function (st, i) { return { step: st, x: 88 + i * 32, tap: true, label: info(st, 'bass').es, aria: info(st, 'bass').es + ', ' + loc(st) }; });
    s.push(stepSummary(2, {
      title: 'Ya lees en clave de fa',
      fig: staffSVG({ clefType: 'bass', notes: map, label: 'Mapa de notas en clave de fa' }),
      hint: 'Tu mapa en clave de fa: de la línea 1 a la línea 5. Toca las notas para escucharlas.',
      bindFig: function (r) { bind(r, { onNote: function (i) { play(map[i].step, 0, 'bass'); } }); }
    }));
    return s;
  }

  var BUILD = { 1: buildL1, 2: buildBass, 3: buildL2, 4: buildL3 };

  function startLesson(n) {
    lessonN = n; results = []; curClef = n === 2 ? 'bass' : 'treble'; frame();
    steps = BUILD[n]();
    go(0);
  }

  home();
})();
</script>
